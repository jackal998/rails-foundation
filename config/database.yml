# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Env-driven so local compose, CI and production all connect the same way.
  # Production normally supplies DATABASE_URL instead, which overrides these.
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "app") %>
  password: <%= ENV.fetch("DB_PASSWORD", nil) %>


development:
  <<: *default
  database: app_development

  # The specified database role being used to connect to PostgreSQL.
  # To create additional roles in PostgreSQL see `$ createuser --help`.
  # When left blank, PostgreSQL will use the default role. This is
  # the same name as the operating system user running Rails.
  #username: app

  # The password associated with the PostgreSQL role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: app_test

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://localhost/somedatabase"
#
#   The example deliberately omits the user:password@ part. This repository
#   is public and its pre-commit secret scan rejects ANY postgres URL that
#   carries a password, including an illustrative one - which is the correct
#   behaviour for a rule that cannot tell a fake credential from a real one.
#   Supply credentials through the environment, never from a committed file.
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Connection URLs for non-primary databases can also be configured using
# environment variables. The variable name is formed by concatenating the
# connection name with `_DATABASE_URL`. For example:
#
#   CACHE_DATABASE_URL="postgres://localhost/cachedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
# WHAT ACTUALLY RUNS IN PRODUCTION, because the block below does not say it.
#
# The deployment points DATABASE_URL, PRIMARY_DATABASE_URL, CACHE_DATABASE_URL,
# QUEUE_DATABASE_URL and CABLE_DATABASE_URL at ONE managed database. The four
# database names below are the fallback for when those variables are unset;
# they are not four databases that exist anywhere. Note that DATABASE_URL on
# its own is not enough: Rails applies it to `primary` only, so a deployment
# that sets just that one gets a working primary and three roles still aiming
# at names nothing has created.
#
# `migrations_paths` below points at db/cache_migrate, db/queue_migrate and
# db/cable_migrate. THOSE DIRECTORIES DO NOT EXIST. Rails 8.1 ships the Solid
# schemas as schema files only, so `db:migrate:cache` exits 0 having done
# nothing, and `db:prepare` creates those tables only along the path it takes
# for a database that does not yet exist -- which is never true when one
# database is already serving primary. That combination took production down
# with exit code 0 on 2026-08-24. bin/prepare-solid-databases is what closes
# it, and script/missing_solid_databases.rb is the check that decides when it
# is safe to. Read both before changing anything here.
production:
  primary: &primary_production
    <<: *default
    database: app_production
    username: app
    password: <%= ENV["APP_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: app_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: app_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: app_production_cable
    migrations_paths: db/cable_migrate
